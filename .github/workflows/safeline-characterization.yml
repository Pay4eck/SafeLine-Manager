name: SafeLine characterization

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterization:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pinned Manager and Panel sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install pinned characterization dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Check Linux smoke-test shell syntax
        run: >-
          bash -n
          smoke-test/install-pinned.sh
          smoke-test/configure-profile.sh
          smoke-test/uv-version.sh
          smoke-test/verify-install.sh
          install.sh
          update.sh
          hiddify-panel/install.sh
          common/hiddify_installer.sh
          common/download.sh
          common/download_install.sh
          common/download_install_easylink.sh
          common/downgrade.sh
          common/docker-installer.sh

      - name: Install checksum-verified Xray 26.3.27
        run: >-
          python tests/scripts/install_verified_xray.py
          --platform linux-amd64
          --destination .test-runtime/xray-linux

      - name: Verify the Xray version and test-only X25519 pair
        run: >-
          python tests/scripts/verify_xray_runtime.py
          --xray .test-runtime/xray-linux/xray
          --metadata tests/fixtures/xray-v26.3.27.json
          --keypair tests/fixtures/xray-test-keypair.json

      - name: Render the inherited full Hiddify Xray server config
        run: >-
          python tests/scripts/render_hiddify_xray.py
          --context tests/fixtures/xray-full-current.json
          --runtime tests/fixtures/xray-render-runtime.json
          --keypair tests/fixtures/xray-test-keypair.json
          --output .test-output/xray-config

      - name: Test the rendered config with the real Xray binary
        env:
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/.test-runtime/xray-linux
        run: >-
          .test-runtime/xray-linux/xray run -test
          -confdir .test-output/xray-config

      - name: Run SafeLine characterization tests
        run: python -m unittest discover -s tests -v

  frontend-reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out SafeLine sources
        uses: actions/checkout@v4

      - name: Set up the upstream frontend Node version
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"

      - name: Install the pinned Yarn version
        run: npm install --global yarn@1.22.22

      - name: Check out the exact upstream frontend source
        run: |
          git init .test-runtime/user-front
          git -C .test-runtime/user-front config core.autocrlf false
          git -C .test-runtime/user-front remote add origin https://github.com/hiddify/hiddify-user-front.git
          git -C .test-runtime/user-front fetch --depth=1 origin 5dc87f743f233b8fd0ff0c40b9a3ddbbe7c2812a
          git -C .test-runtime/user-front checkout --detach FETCH_HEAD
          test "$(git -C .test-runtime/user-front rev-parse HEAD)" = "5dc87f743f233b8fd0ff0c40b9a3ddbbe7c2812a"

      - name: Apply the reviewed SafeLine source patch
        run: |
          git -C .test-runtime/user-front apply --check ../../safeline/frontend/patches/0001-safeline-branding.patch
          git -C .test-runtime/user-front apply ../../safeline/frontend/patches/0001-safeline-branding.patch

      - name: Build with the corrected frozen lockfile
        working-directory: .test-runtime/user-front
        run: |
          test "$(node --version)" = "v16.20.2"
          test "$(yarn --version)" = "1.22.22"
          yarn install --frozen-lockfile
          yarn build

      - name: Compare all generated SafeLine frontend files
        run: >-
          python safeline/frontend/publish_frontend.py
          --dist .test-runtime/user-front/dist
          --check-static safeline/static/user-front
          --check-template safeline/templates/new.html
